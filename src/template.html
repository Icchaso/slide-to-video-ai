<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: 'Noto Sans JP', sans-serif; }
      
      /* HyperFramesのタイムライン制御用クラス */
      .clip { opacity: 1; } 
      
      .slide-image {
        position: absolute;
        width: 1920px;
        height: 1080px;
        object-fit: contain;
      }
      
      /* プロ級のテロップデザイン */
      .subtitle-wrapper {
        position: absolute;
        width: 1920px;
        bottom: 45px; /* 画面下からの余白を減らし、より下部に配置 */
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }
      
      .subtitle-box {
        max-width: 1600px;
        text-align: center;
        font-size: 54px;
        color: #ffffff;
        font-weight: 900;
        white-space: pre-wrap;
        line-height: 1.25; /* 行間を詰めて間延びを防ぐ */
        letter-spacing: 2px;
        
        /* 囲み（背景）を完全に削除し、文字自体の視認性を極めるスタイル */
        padding: 10px 40px;
        
        /* 禁則処理を厳格化し、不自然な改行（例：ーション の分離）を防ぐ */
        line-break: strict;
        word-break: normal;
        
        /* text-strokeは文字の内側を潰すため廃止し、外側のみに影（縁取り）を生成する */
        text-shadow: 
          3px 3px 0 #000, -3px -3px 0 #000, 
          -3px 3px 0 #000, 3px -3px 0 #000,
          0px 3px 0 #000, 0px -3px 0 #000,
          3px 0px 0 #000, -3px 0px 0 #000,
          0px 8px 15px rgba(0,0,0,0.8);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="<!-- TOTAL_DURATION -->" data-width="1920" data-height="1080">
      <!-- INSERT_CLIPS_HERE -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      
      // プロ級のGSAPアニメーション
      document.querySelectorAll('.clip').forEach(clip => {
        const start = parseFloat(clip.dataset.start);
        const duration = parseFloat(clip.dataset.duration);
        
        // スライド画像：シネマティックなゆっくりとしたズーム
        if (clip.classList.contains('slide-image')) {
          const img = clip.querySelector('img');
          if (img) {
            tl.fromTo(img, 
              { scale: 1.0 }, 
              { scale: 1.05, duration: duration, ease: "none" }, 
              start
            );
          }
        }
        
        // テロップ：バウンス感のあるリッチなポップイン
        const subtitleBox = clip.querySelector('.subtitle-box');
        if (subtitleBox) {
          // 箱自体がポンッと現れる
          tl.fromTo(subtitleBox, 
            { y: 50, scale: 0.9, opacity: 0 }, 
            { y: 0, scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.5)" }, 
            start
          );
        }
      });
    </script>
  </body>
</html>
